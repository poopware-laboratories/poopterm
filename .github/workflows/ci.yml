name: Build, test and release

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to a pull request cancels its older run. Each push to main gets
# its own group, so main's runs neither queue nor get cancelled.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux libraries
        if: runner.os == 'Linux'
        # zsh and fish run the shell hooks' tests, which skip missing shells;
        # Mesa's software Vulkan driver and the validation layer run the
        # Vulkan tests.
        run: sudo apt-get update && sudo apt-get install -y pkg-config libx11-dev libxkbcommon-dev libwayland-dev zsh fish libvulkan1 mesa-vulkan-drivers vulkan-validationlayers

      # The checked-in SPIR-V must be what the GLSL compiles to with the
      # pinned glslc; scripts/shaders.sh names the SDK it comes from.
      - name: Cache the shader compiler
        if: runner.os == 'Linux'
        id: shader-tools
        uses: actions/cache@v6
        with:
          path: ~/vulkan-sdk
          key: vulkan-sdk-1.4.363.0-glslc-spirv-val

      - name: Install the shader compiler
        if: runner.os == 'Linux' && steps.shader-tools.outputs.cache-hit != 'true'
        run: |
          curl -fsSL -o /tmp/sdk.tar.xz https://sdk.lunarg.com/sdk/download/1.4.363.0/linux/vulkansdk-linux-x86_64-1.4.363.0.tar.xz
          echo "197962f5cbf80baf2775a03336a01cee7c8745686c65aaa70d3f751ade4d7e43  /tmp/sdk.tar.xz" | sha256sum -c
          mkdir -p ~/vulkan-sdk
          tar -xJf /tmp/sdk.tar.xz -C ~/vulkan-sdk --strip-components=3 1.4.363.0/x86_64/bin/glslc 1.4.363.0/x86_64/bin/spirv-val

      - name: Check the SPIR-V matches the shaders
        if: runner.os == 'Linux'
        run: GLSLC=~/vulkan-sdk/glslc SPIRV_VAL=~/vulkan-sdk/spirv-val scripts/shaders.sh --check

      - name: Install nightly Rust
        run: rustup toolchain install nightly --profile minimal --component rustfmt --component clippy

      - name: Test release tools and PTY benchmark
        run: python3 -m unittest discover -s tests

      - name: Run fmt
        run: cargo +nightly fmt --check

      - name: Run tests
        run: cargo +nightly test --locked
        env:
          # Fail, not skip, the Vulkan tests if the driver is missing.
          POOPTERM_REQUIRE_VULKAN: ${{ runner.os == 'Linux' && '1' || '' }}

      - name: Run clippy
        run: cargo +nightly clippy --locked --all-targets -- -D warnings

      - name: Check BSD-specific code
        if: runner.os == 'Linux'
        run: |
          rustup +nightly target add x86_64-unknown-freebsd
          cargo +nightly clippy --locked --target x86_64-unknown-freebsd --all-targets -- -D warnings

      # On Linux the debian-package job builds and runs the release binary.
      - name: Build release binary
        if: runner.os == 'macOS'
        run: cargo +nightly build --release --locked

      - name: Verify binary execution
        if: runner.os == 'macOS'
        run: ./target/release/poopterm --version

  freebsd:
    runs-on: ubuntu-latest
    # Booting the VM and a cold build take a few minutes; a hang should not take 6 hours.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Build and test on FreeBSD
        # Third-party: pinned to a commit; Dependabot updates the pin.
        uses: vmactions/freebsd-vm@c46abacb49f09938ca4e1702d15d836285d694cc # v1.5.9
        with:
          usesh: true
          # Only what needs FreeBSD itself: the tests (PTYs, shells, paths)
          # and a binary that runs. Formatting and lints, BSD code included,
          # run on Linux; no FreeBSD release binary ships, so no slow LTO
          # build. Libraries only, not the whole X server.
          prepare: |
            pkg install -y curl pkgconf libX11 libxkbcommon wayland bash zsh python311
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs -o /tmp/rustup.sh
            sh /tmp/rustup.sh -y --default-toolchain nightly --profile minimal
          run: |
            . "$HOME/.cargo/env"
            cargo test --locked
            cargo build --locked
            ./target/debug/poopterm --version

  # musl and rustup's static default: the binary must stay dynamically
  # linked, or winit cannot load the Wayland and X11 libraries.
  alpine:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: alpine:latest
    steps:
      - uses: actions/checkout@v7
      - name: Install libraries and nightly Rust
        # zsh, bash and fish: the shell integration tests run each of them.
        run: |
          apk add --no-cache build-base pkgconf libx11-dev libxkbcommon-dev wayland-dev curl bash fish zsh python3 binutils
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs -o /tmp/rustup.sh
          sh /tmp/rustup.sh -y --default-toolchain nightly --profile minimal
      - name: Run tests
        run: . "$HOME/.cargo/env" && cargo test --locked
      - name: Build and check the binary is dynamically linked
        run: |
          . "$HOME/.cargo/env"
          cargo build --locked
          readelf -l target/debug/poopterm | grep -q INTERP
          ./target/debug/poopterm --version

  debian-package:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux and Debian packaging libraries
        run: sudo apt-get update && sudo apt-get install -y pkg-config libx11-dev libxkbcommon-dev libwayland-dev dpkg-dev ncurses-bin

      - name: Install nightly Rust
        run: rustup toolchain install nightly --profile minimal

      - name: Build release binary
        run: cargo +nightly build --release --locked

      - name: Build Debian package
        run: bash scripts/package-deb.sh

      # For trying out a pull request's package; releases build their own.
      # Uploaded as the .deb itself, named after it, so it installs as is.
      - name: Upload Debian package
        uses: actions/upload-artifact@v7
        with:
          archive: false
          path: dist/*.deb
          if-no-files-found: error
          retention-days: 7

  # Builds and installs the RPM on current Fedora. Releases package the
  # Ubuntu-built PGO binary instead, whose older glibc Fedora also runs.
  fedora-package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: registry.fedoraproject.org/fedora:latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Fedora packaging libraries and nightly Rust
        run: |
          dnf install -y gcc pkgconf-pkg-config libX11-devel libxkbcommon-devel wayland-devel rpm-build ncurses cpio python3 curl
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs -o /tmp/rustup.sh
          sh /tmp/rustup.sh -y --default-toolchain nightly --profile minimal

      - name: Build release binary
        run: . "$HOME/.cargo/env" && cargo build --release --locked

      - name: Test the RPM packaging script
        run: python3 -m unittest tests.test_package_rpm

      - name: Build RPM package
        run: bash scripts/package-rpm.sh

      - name: Install the RPM package and run it
        run: |
          dnf install -y dist/*.rpm
          rpm -V poopterm
          poopterm --version
          infocmp xterm-poopterm >/dev/null

      # For trying out a pull request's package; releases build their own.
      - name: Upload RPM package
        uses: actions/upload-artifact@v7
        with:
          archive: false
          path: dist/*.rpm
          if-no-files-found: error
          retention-days: 7

  # Builds the PKGBUILD with makepkg and installs the result on Arch Linux.
  arch-package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: archlinux:latest
    steps:
      # Before checkout, which needs git to clone rather than download.
      - name: Install Arch packaging tools
        run: pacman -Syu --noconfirm --needed base-devel git rustup ncurses libxkbcommon

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # makepkg refuses to run as root and builds the tag v$pkgver; point it
      # at this checkout instead, so pull requests build their own code.
      - name: Build the Arch package from this checkout
        run: |
          git config --system --add safe.directory '*'
          git branch -f arch-ci HEAD
          useradd -m builder
          install -d -o builder /tmp/arch
          cp packaging/arch/PKGBUILD /tmp/arch/
          sed -i "s|^source=.*|source=(\"\$pkgname::git+file://$GITHUB_WORKSPACE#branch=arch-ci\")|" /tmp/arch/PKGBUILD
          cd /tmp/arch && su builder -c 'makepkg --noconfirm'

      - name: Install the Arch package and run it
        run: |
          pacman -U --noconfirm /tmp/arch/poopterm-[0-9]*.pkg.tar.zst
          poopterm --version
          infocmp xterm-poopterm >/dev/null

  release:
    needs: [check, freebsd, alpine, debian-package, fedora-package, arch-package]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # Builds the Debian and RPM packages after the version bump, on the same
    # old glibc as the debian-package job.
    runs-on: ubuntu-22.04
    # The PGO build compiles three times and trains in between.
    timeout-minutes: 60
    permissions:
      contents: write
      # Sigstore signing of the package's build provenance.
      id-token: write
      attestations: write
    concurrency:
      group: poopterm-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # main is protected; this write deploy key is the ruleset's only
          # bypass, so the release commits can land there.
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}
      - name: Install Linux, Debian and RPM packaging libraries
        run: sudo apt-get update && sudo apt-get install -y pkg-config libx11-dev libxkbcommon-dev libwayland-dev dpkg-dev ncurses-bin rpm
      - name: Install nightly Rust
        # llvm-tools holds the llvm-profdata that matches rustc's LLVM.
        run: rustup toolchain install nightly --profile minimal --component llvm-tools
      # Ubuntu 22.04 ships Python 3.10; the release scripts need tomllib (3.11).
      - name: Install Python for the release scripts
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Publish the checked main revision
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash scripts/release.sh
      # Signs which run and commit built the packages; verify a download with
      # `gh attestation verify <file> --repo poopware-laboratories/poopterm`.
      - name: Attest the released package
        if: hashFiles('dist/poopterm_*.deb') != ''
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/poopterm_*.deb
            dist/poopterm-*.rpm
