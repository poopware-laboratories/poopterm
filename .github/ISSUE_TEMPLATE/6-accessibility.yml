name: Accessibility problem
description: Something keeps you from using Poopterm with your setup, keyboard, display or assistive technology.
labels: [accessibility, needs triage]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for telling us. You do not need to know the cause or a fix: what you tried to do and what got in the way is enough.
        [ACCESSIBILITY.md](https://github.com/poopware-laboratories/poopterm/blob/main/ACCESSIBILITY.md) lists the known limitations and their workarounds.

  - type: textarea
    id: goal
    attributes:
      label: What were you trying to do?
      placeholder: Switch to the second tab without a mouse.
    validations:
      required: true

  - type: textarea
    id: barrier
    attributes:
      label: What got in the way?
      description: What you expected, and what happened instead. A screenshot or screen recording helps if you can make one.
      placeholder: The Settings window has no way to reach the font size control from the keyboard.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Optional, if the problem depends on what you do first.
      placeholder: |
        1. Open Settings with Ctrl+Shift+P, then "settings"
        2. Press Tab

  - type: dropdown
    id: severity
    attributes:
      label: How much does it affect you?
      options:
        - Critical — I cannot do a core task (start a shell, read output, type) at all
        - High — I can do it, but only with real difficulty or a workaround
        - Medium — it works inconsistently or is tiring to use
        - Low — a minor annoyance
    validations:
      required: true

  - type: input
    id: assistive
    attributes:
      label: Assistive technology
      description: Screen reader, magnifier, voice control, switch access, on-screen keyboard, input method… with versions. Write "none" if you use none.
      placeholder: Orca 48, GNOME 50 zoom at 200%
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Poopterm version
      description: Settings → About, or the output of `poopterm --version`.
      placeholder: poopterm 26.10.61
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system, desktop and display server
      placeholder: Fedora 46, GNOME 50, Wayland
    validations:
      required: true

  - type: textarea
    id: config
    attributes:
      label: Theme, font size and other settings
      description: The relevant lines from your `config.toml`, such as `theme`, `font_size` and color overrides.
      render: toml

  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Whether other terminals work for you here, and what they do differently.
