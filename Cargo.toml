# trim-paths (nightly, like the rest of the build) keeps the build machine's
# paths out of the binaries we ship.
cargo-features = ["trim-paths"]

[package]
name = "poopterm"
version = "26.11.49"
edition = "2024"
license = "AGPL-3.0-or-later"

[package.metadata.poopterm]
# Versions are YEAR.MONTH.PATCH; each month gets a random codename, patches keep it.
codename = "Lunar Moth"

[dependencies]
winit = "^0.30"
softbuffer = "^0.4"
portable-pty = "^0.9"
miniz_oxide = "^0.9"
# shm_open/mmap and O_NONBLOCK opens for kitty graphics media.
libc = "^0.2"
image = { version = "^0.25", default-features = false, features = ["png", "jpeg", "webp"] }
rfd = { version = "^0.17", default-features = false, features = ["xdg-portal"] }
# Global allocator: the system ones (musl above all) cost throughput.
mimalloc = { version = "^0.1", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"

# Debug builds and tests keep file and line numbers for backtraces but no
# variable info: the test run is 18% faster and target/ 27% smaller. For a
# debugger session with locals, build with CARGO_PROFILE_DEV_DEBUG=full, or
# use the `debugging` profile below.
[profile.dev]
debug = "line-tables-only"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
overflow-checks = false
# Panic locations name `poopterm-<version>/src/...` and `<crate>-<version>/...`
# instead of /home/<user>/.cargo/registry/...: no user names or build
# directories in released binaries, and the same bytes from any checkout.
trim-paths = "all"

# Release optimizations with every compile-time debugging aid: full debug
# info, debug assertions (including the terminal lock's double-lock check),
# overflow checks, and unwinding panics with backtraces. For chasing bugs at
# full speed; the checks change timings, so benchmark with `profiling`.
[profile.debugging]
inherits = "release"
# Full paths, so debuggers and perf find the sources.
trim-paths = "none"
debug = "full"
strip = "none"
debug-assertions = true
overflow-checks = true
panic = "unwind"

# Release exactly, plus symbols, for perf and callgrind.
[profile.profiling]
inherits = "release"
# Full paths, so debuggers and perf find the sources.
trim-paths = "none"
debug = "full"
strip = "none"

# Release speed for tests that need it (differential tests on real fonts,
# mutation checks): no LTO and parallel, incremental code generation, so the
# test binary rebuilds in about 4 s instead of 160 s after an edit. Runs a
# few percent slower than release on some workloads, so never benchmark it.
[profile.fast]
inherits = "release"
lto = false
codegen-units = 16
incremental = true

[dev-dependencies]
# Oracle for the generated width table (src/width.rs).
unicode-width = "^0.2"
# The reference that `vt` and the terminal are tested against.
vte = "^0.15"
# The reference that the font engine (`fonts::font`) is tested against.
fontdue = "^0.9"

[lints.clippy]
# Every unsafe block says why it is sound (see AGENTS.md).
undocumented_unsafe_blocks = "deny"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
